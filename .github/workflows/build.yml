name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ACLOCAL_PATH: /usr/share/aclocal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-ubuntu22-p4a2024.1.21-buildozer-${{ hashFiles('buildozer.spec', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu22-p4a2024.1.21-buildozer-

      - name: Remove stale libffi build cache
        run: rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi*

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Show autotools versions
        run: |
          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1

      - name: Force stable python-for-android
        run: |
          python -m pip show python-for-android || true
          pip uninstall -y python-for-android || true
          pip install "python-for-android==2024.1.21"
          python -m pip show python-for-android

      - name: Build APK (debug)
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer-ci.log

      - name: Print likely failure lines
        if: failure()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("buildozer-ci.log")
          if not p.exists():
              print("buildozer-ci.log not found")
              raise SystemExit(0)

          lines = p.read_text(errors="replace").splitlines()
          patterns = [
              re.compile(r"(^|\b)(error|failed|exception|traceback)(\b|:)", re.I),
              re.compile(r"libffi", re.I),
          ]
          hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in patterns)]

          print("---- Diagnostic extract from buildozer-ci.log ----")
          if not hits:
              start = max(0, len(lines) - 200)
              for line in lines[start:]:
                  print(line)
          else:
              shown = set()
              for idx in hits[-20:]:
                  for j in range(max(0, idx - 3), min(len(lines), idx + 4)):
                      if j not in shown:
                          print(lines[j])
                          shown.add(j)
                  print("-")
          print("---- End diagnostic extract ----")
          PY

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            buildozer-ci.log
            .buildozer/**/*.log
            .buildozer/**/config.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-apk
          path: bin/*.apk
          if-no-files-found: error
