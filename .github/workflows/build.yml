name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      ACLOCAL_PATH: /usr/share/aclocal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-ubuntu22-p4a2024.1.21-buildozer-${{ hashFiles('buildozer.spec', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu22-p4a2024.1.21-buildozer-

      - name: Remove stale libffi build cache
        run: rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi*

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Show autotools versions
        run: |
          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1

      - name: Force stable python-for-android
        run: |
          python -m pip show python-for-android || true
          pip uninstall -y python-for-android || true
          pip install "python-for-android==2024.1.21"
          python -m pip show python-for-android

      - name: Build APK (debug)
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-apk
          path: bin/*.apk
          if-no-files-found: error
